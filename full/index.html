<title>需要登入｜SeniorHousing EcoMap</title>
<style>
:root{--navy:#16233A;--slate:#5B6472;--line:#E0D8CC;--sf:#FFFDF9;--accent:#9C6B3C}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
  background:#F7F4EF;color:var(--navy);
  font-family:"Noto Sans TC",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.85}
.box{max-width:34rem;background:var(--sf);border:1px solid var(--line);
  border-radius:14px;padding:2rem 2.2rem;text-align:center}
.lock{width:3rem;height:3rem;margin:0 auto 1rem;border-radius:50%;
  display:grid;place-items:center;background:#EEE9E0;font-size:1.5rem}
h1{font-size:1.25rem;margin:0 0 .7rem}
p{font-size:.92rem;color:var(--slate);margin:0 0 .8rem}
.go{display:inline-block;margin-top:.6rem;background:var(--navy);color:#fff;
  text-decoration:none;font-weight:600;padding:.6rem 1.4rem;border-radius:8px}
.go:hover{background:#22334E}
.nolink{margin-top:.6rem;font-weight:600;color:var(--navy)}
.foot{margin-top:1.4rem;padding-top:1rem;border-top:1px solid var(--line);
  font-size:.82rem;color:var(--slate)}
.stamp{opacity:.75;font-size:.76rem;margin-top:.9rem;
  display:flex;align-items:center;justify-content:center;gap:.45rem}
.stamp svg{flex:none;opacity:.8}
</style>
<div class="box">
  <div class="lock">🔒</div>
  <h1>這一頁需要登入才能看</h1>
  <p>
    完整導覽器（39 個模組）已改為登入後提供。內容存放在需要授權的資料庫，
    <b>不再放在網頁檔案裡</b>——因此拿到這個網址並不等於看得到內容。
  </p>
  <p>
    請以公司帳號登入工具站，於「完整導覽器」分頁閱讀。
  </p>
  <a class="go" href="https://senior-housing-rghealth.web.app/#/navigator">登入後閱讀完整導覽器 →</a>
  <div class="foot">
    登入後若顯示「尚未獲授權」，請把您的帳號 email 給內部窗口，
    由管理員在工具站的「權限管理」頁加入名單即可，不需要任何指令。
  </div>

</div>
